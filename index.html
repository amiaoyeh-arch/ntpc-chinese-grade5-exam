<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>108課綱 國小五年級國語文能力檢測試題與詳解 線上導覽門戶</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0F4C3A;
      --primary-light: #166534;
      --primary-subtle: #ECFDF5;
      --accent: #CA8A04;
      --accent-light: #FEF08A;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(15, 76, 58, 0.08);
      --shadow-hover: 0 10px 25px -3px rgba(15, 76, 58, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0F4C3A 0%, #064E3B 100%);
      color: #FFFFFF;
      padding: 45px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(15, 76, 58, 0.25);
    }

    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.92;
      max-width: 820px;
      margin: 0 auto 20px;
    }

    .badge-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Control Panel */
    .control-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .control-group {
      margin-bottom: 18px;
    }

    .control-group:last-child { margin-bottom: 0; }

    .group-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 30px;
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(15, 76, 58, 0.25);
    }

    /* Download Box */
    .download-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-subtle);
      border: 1px solid #A7F3D0;
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .download-info h3 {
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .download-info p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .download-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dl-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .dl-pptx {
      background: #D97706;
      color: #FFFFFF;
    }
    .dl-pptx:hover { background: #B45309; }

    .dl-pdf {
      background: #DC2626;
      color: #FFFFFF;
    }
    .dl-pdf:hover { background: #B91C1C; }

    .dl-excel {
      background: #059669;
      color: #FFFFFF;
    }
    .dl-excel:hover { background: #047857; }

    /* Question Cards Grid */
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
    }

    .q-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-col: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .q-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .q-header {
      background: #F1F5F9;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .q-title {
      font-weight: 800;
      color: var(--primary);
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-ans-badge {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .q-img-wrap {
      padding: 16px;
      background: #FAFAFA;
      text-align: center;
      border-bottom: 1px solid var(--border);
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .q-img-wrap img {
      max-width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      transition: transform 0.2s ease;
    }

    .q-img-wrap:hover img {
      transform: scale(1.02);
    }

    .q-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: var(--primary-light);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .sec-block {
      background: #F8FAFC;
      border-radius: 8px;
      padding: 12px 14px;
      border-left: 4px solid var(--primary);
    }

    .sec-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .sec-content {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }

    .tip-block {
      background: #FEFCE8;
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .tip-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #854D0E;
      margin-bottom: 4px;
    }

    .tip-content {
      font-size: 0.88rem;
      color: #713F12;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #FFFFFF;
      padding: 12px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #FFFFFF;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }

    /* Footer */
    footer {
      margin-top: 60px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header h1 { font-size: 1.6rem; }
      .question-grid { grid-template-columns: 1fr; }
      .download-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

  let currentYear = "115";
  let currentDim = "all";

  function renderDownloadBar() {
    const dlTitle = document.getElementById("dl-title");
    const dlLinks = document.getElementById("dl-links");
    dlTitle.innerHTML = `<i class="fa-solid fa-folder-open"></i> ${currentYear} 年度五年級國語科 資源檔案一鍵下載`;
    
    dlLinks.innerHTML = `
      <a class="dl-btn dl-pptx" href="${currentYear}年度/${currentYear}年_國語科五年級_試題與詳解.pptx" download><i class="fa-solid fa-file-powerpoint"></i> 下載 PPTX 簡報 (61頁)</a>
      <a class="dl-btn dl-pdf" href="${currentYear}年度/${currentYear}年_國語科五年級_題本.pdf" target="_blank"><i class="fa-solid fa-file-pdf"></i> 原版題本 PDF</a>
      <a class="dl-btn dl-excel" href="${currentYear}年度/${currentYear}年_國語科五年級_答案.xlsx" download><i class="fa-solid fa-file-excel"></i> 官方答案 Excel</a>
    `;
  }

  function renderQuestions() {
    const grid = document.getElementById("q-grid");
    grid.innerHTML = "";
    
    const yearList = examData[currentYear] || [];
    const filtered = yearList.filter(q => {
      if (currentDim === "all") return true;
      return q.dimension === currentDim;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; background: #fff; border-radius: 16px; color: #64748B;">
        <i class="fa-solid fa-magnifying-glass" style="font-size: 2rem; margin-bottom: 12px; display: block;"></i>
        該年度無此評量向度的題目
      </div>`;
      return;
    }

    filtered.forEach(q => {
      const card = document.createElement("div");
      card.className = "q-card";
      const imgSrc = `${currentYear}年度/crops/Q${String(q.qnum).padStart(2, '0')}.png`;
      
      card.innerHTML = `
        <div class="q-header">
          <div class="q-title"><i class="fa-solid fa-circle-question"></i> 第 ${q.qnum} 題</div>
          <div class="q-ans-badge">正解：(${q.answer})</div>
        </div>
        <div class="q-img-wrap" onclick="openModal('${imgSrc}')">
          <img src="${imgSrc}" alt="第 ${q.qnum} 題 試題截圖" loading="lazy">
        </div>
        <div class="q-body">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <span class="meta-tag"><i class="fa-solid fa-bullseye"></i> ${q.dimension}</span>
          </div>

          <div class="sec-block">
            <div class="sec-label"><i class="fa-solid fa-graduation-cap"></i> 學習表現與學習內容</div>
            <div class="sec-content" style="font-size: 0.84rem; color: #334155;">
              • <strong>表現</strong>：${q.learning_performance}<br>
              • <strong>內容</strong>：${q.learning_content}
            </div>
          </div>

          <div class="sec-block">
            <div class="sec-label"><i class="fa-solid fa-lightbulb"></i> 試題深度解析</div>
            <div class="sec-content">${q.detailed_analysis.replace(/\n/g, '<br>')}</div>
          </div>

          <div class="tip-block">
            <div class="tip-label"><i class="fa-solid fa-thumbtack"></i> 解題關鍵與教學引導</div>
            <div class="tip-content">${q.tips}</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Event Listeners
  document.getElementById("year-filters").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#year-filters .btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentYear = btn.dataset.year;
    renderDownloadBar();
    renderQuestions();
  });

  document.getElementById("dim-filters").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#dim-filters .btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDim = btn.dataset.dim;
    renderQuestions();
  });

  function openModal(src) {
    document.getElementById("modal-img").src = src;
    document.getElementById("modal").classList.add("show");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("show");
  }

  // Init
  renderDownloadBar();
  renderQuestions();
